services:
  scraper:
    build: .
    image: buyr-scraper:latest
    container_name: buyr-scraper
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1 only — expose publicly via Caddy/Cloudflare Tunnel.
      # Change to "8000:8000" if you want to hit it directly for testing.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    # Playwright's Chromium needs extra shared memory to render pages.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
